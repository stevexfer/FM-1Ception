# FM-1Ception for Linux: the VST3 and the standalone, x86-64 and arm64, smoke-tested.
#
# Built in Ubuntu 22.04 (glibc 2.35), so they run on it, Debian 12, Fedora 36, Arch and anything
# newer. Publishing a release attaches them to it as tarballs, beside the macOS and Windows
# installers fm1ception/installer/build_all.sh makes. On a pull request that changes the plugin,
# or run by hand, they are kept as the run's artifacts instead.

name: Plugin (Linux)

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'fm1ception/**'
      - 'crates/fm1-core/**'
      - 'crates/fm1-isa/**'
      - 'crates/fm1-soc/**'
      - 'crates/fm1-plugin/src/**'
      - '.github/workflows/plugin-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash    # a container's steps get sh otherwise
    steps:
      - name: Packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build git curl ca-certificates \
            libasound2-dev libcurl4-openssl-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev

      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S fm1ception -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # A real firmware boots, plays, keeps up and routes MIDI: Felucca (GPL-3.0), from its
      # author's GitHub release, checked byte for byte so the test always runs the same one.
      - name: Firmware for the smoke test
        run: |
          curl -sSfL -o felucca.fwsc https://github.com/hugelton/Felucca/releases/download/v1.8.2/felucca-1.8.2.fwsc
          echo "770ea7c756088d08ac59a193f1ae78126476c3c8251a86938c837ead5ab0048a  felucca.fwsc" | sha256sum -c

      - name: Smoke test
        run: build/FM1CeptionTests_artefacts/Release/FM1CeptionTests felucca.fwsc

      # Named for the release's title ("1.0.0b4", as the installers are), else its tag, else the commit.
      - name: Package
        env:
          RELEASE: ${{ github.event.release.name || github.event.release.tag_name }}
        run: |
          version=${RELEASE:-${GITHUB_SHA:0:12}}
          version=$(printf %s "$version" | tr -c 'A-Za-z0-9._-' '_')
          name=FM-1Ception_${version}_Linux_${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp -R build/FM1Ception_artefacts/Release/VST3/FM-1Ception.vst3 \
                build/FM1Ception_artefacts/Release/Standalone/FM-1Ception \
                fm1ception/LICENSE "dist/$name/"
          cat > "dist/$name/INSTALL.txt" <<'EOF'
          FM-1Ception for Linux

          VST3:       copy FM-1Ception.vst3 into ~/.vst3/ (or /usr/lib/vst3/ for everyone)
          Standalone: run ./FM-1Ception

          It needs glibc 2.35 or newer, ALSA, FreeType, Fontconfig and X11, which a desktop
          has. The Cloud tab also needs libcurl (libcurl.so.4).
          EOF
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "TARBALL=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.TARBALL }}

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz --clobber -R "${{ github.repository }}"
